device: auto
output_root: outputs
data:
  context_len: 10
  horizon: 50
  window_stride: 5
  input_signal: multisine
  multisine:
    f_min: 0.0049
    f_max: 4.88
    harmonics: 30
    peak: 15.0
    spacing: linear
  train_samples: 40000
  val_samples: 10000
  test_samples: 10000
  initial_state_low:
  - -2.5
  - -2.0
  initial_state_high:
  - 2.5
  - 2.0
  data_seed: 12345
training:
  epochs: 40
  batch_size: 256
  lr: 0.001
  weight_decay: 1.0e-05
  lr_decay_gamma: 0.97
  grad_clip: 1.0
  checkpoint_every: 5
  clamp_state: 50.0
  max_nonfinite_fraction: 0.5
  select_best_on_validation: true
  regime: teacher_forcing
evaluation:
  report_steps:
  - 1
  - 10
  - 50
  max_eval_windows: 2000
  jacobian_windows: 16
  limit_cycle_steps: 1000
  limit_cycle_start:
  - 2.0
  - 0.0
run:
  long_run_confirm_minutes: 30
system:
  name: vanderpol
  mu: 1.0
  dt: 0.1
  include_minus_x1: true
  state_names:
  - position
  - velocity
name: exp01_certificate_ablation
question: If we remove the built-in stability guarantee, do predictions get worse?
hypothesis: "H1: the latent certificate is binding \u2014 removing it (decay allowed\
  \ either sign) changes 50-step prediction error by more than 20% under the same\
  \ training regime.\n"
math_signal:
  signal: NEGATIVE for H1 (we expect no difference)
  what_was_checked: '(1) a01: the certificate fixes only the determinant-like part
    of the augmented Jacobian; chained stability depends on det(-(D + C (I - A_bar)^(-1)
    B)), which the certificate does not constrain. (2) Gradient of the loss pushes
    decay towards negative values whenever memory growth hurts the fit, so free-sign
    training is expected to stay negative (first attempt: it did). (3) Unstable start:
    A_bar = exp(Delta * A) with A up to +16 and Delta up to 0.1 gives growth up to
    exp(1.6) = 5 per step; over 60 steps that exceeds the float32 range, so the loss
    is non-finite from the first batch.

    '
  prediction: 'free_sign within 20% of certified in every training regime; unstable_init
    diverges in every training regime.

    '
  assumptions: 'trained models reach similar fits; linearisation of a01 is local;
    initial step sizes drawn from [0.001, 0.1] as in Mamba.

    '
decision_rule:
  type: ablation
  metric: rollout_rmse
  threshold_percent: 20
  equivalence_margin_percent: 10
model:
  name: ssm_minimal
  d_model: 32
  d_state: 16
  dt_min: 0.001
  dt_max: 0.1
  decay_mode: certified
  unstable_init_scale: 1.0
  use_parallel_scan: true
arm:
  name: certified_teacher
  model: ../models/ssm_minimal.yaml
  training_regime: teacher_forcing
  group: teacher_forcing
  role: baseline
  why: the latent certificate on (decay forced negative), standard training
quick_mode: false
